<!--
The Mahāsāṃghika Vinaya, an ancient Indian Buddhist monastic code, divides a single day and night into thirty muhūrtas. Each muhūrta holds twenty layas, and each laya twenty finger-snaps (acchaṭā). Beneath the finger-snap lie still finer measures: the blink (nimeṣa) and the moment (kṣaṇa), a single moment lasting a mere eighteen milliseconds. This work translates that ancient system of reckoning time into the most familiar of forms, the clock face, inviting viewers to sense the subtlety of the Buddhist conception of time as they move between its units and its counting systems.

印度經典《摩訶僧祇律》中將1天分為30個須臾，1個須臾有20個羅豫，1個羅豫裡有20個彈指，彈指之下還有瞬與念。念即剎那，一念僅約十八毫秒。本作品將這套古老的計時法則，轉譯為人們再熟悉不過的鐘面形式，邀請觀眾在不同單位與進位制的轉換之中，體驗佛教微妙的時間觀。
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kshanaClock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<style>
  /* Figma: body 388 × 743 · Ellipse 360 · ticks 2 × 20 · Fraunces 28 */
  :root {
    --s: 1;                       /* clock scale, set by script on small screens */
    --ink: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #270e3c;
  }

  body {
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── five skies, cross-faded by time of day ─────────────────────────── */
  .sky {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 6s ease-in-out;
  }
  .sky.is-on { opacity: 1; }
  .sky--night     { background: linear-gradient(180deg, #286d8c 0%, #270e3c 100%); } /* 19:00–03:00 */
  .sky--predawn   { background: linear-gradient(180deg, #270e3c 0%, #3d94b1 100%); } /* 03:00–05:00 */
  .sky--morning   { background: linear-gradient(180deg, #88c0ff 0%, #fff3c4 100%); } /* 05:00–12:00 */
  .sky--afternoon { background: linear-gradient(180deg, #fff3c4 0%, #fed7c3 100%); } /* 12:00–17:00 */
  .sky--dusk      { background: linear-gradient(180deg, #fdd7ca 0%, #4089a9 100%); } /* 17:00–19:00 */

  /* ── clock ─────────────────────────────────────────────────────────── */
  .clock {
    position: fixed;
    left: 50%;
    top: 50%;
    width: calc(440px * var(--s));
    height: calc(440px * var(--s));
    transform: translate(-50%, -50%);
    overflow: visible;
    z-index: 100;
    opacity: 0;
    transition: opacity 1.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .clock.is-ready { opacity: 1; }
  .clock:focus { outline: none; }

  .label {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: 28px;
    fill: var(--ink);
  }
  .readout {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 0.05em;
    fill: var(--ink);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="sky sky--night"     data-sky="night"></div>
  <div class="sky sky--predawn"   data-sky="predawn"></div>
  <div class="sky sky--morning"   data-sky="morning"></div>
  <div class="sky sky--afternoon" data-sky="afternoon"></div>
  <div class="sky sky--dusk"      data-sky="dusk"></div>

  <svg class="clock" id="clock" viewBox="-220 -220 440 440" role="button" tabindex="0"
       aria-label="Clock. Press to switch between Buddhist time and conventional time.">
    <defs>
      <!-- r 191: label baseline, read clockwise over the top, glyphs facing out -->
      <path id="arc-label" d="M 0 191 A 191 191 0 1 1 0 -191 A 191 191 0 1 1 0 191"/>
      <!-- r 213: readout baseline, read left→right along the bottom, glyphs facing in -->
      <path id="arc-readout" d="M 0 -213 A 213 213 0 1 0 0 213 A 213 213 0 1 0 0 -213"/>

      <filter id="shadow-10" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#000" flood-opacity="0.10"/>
      </filter>
      <filter id="shadow-15" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
      </filter>    </defs>

    <!-- face: white 10% fill, 2px inside stroke at 30% -->
    <circle r="180" fill="#fff" fill-opacity="0.1"/>
    <circle r="179" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>

    <g id="ticks" fill="#fff"></g>

    <text class="label" id="label-b" text-anchor="middle"><textPath href="#arc-label" startOffset="50%">the Buddhist Time</textPath></text>
    <text class="label" id="label-c" text-anchor="middle" opacity="0"><textPath href="#arc-label" startOffset="50%">the Conventional Time</textPath></text>

    <text class="readout" id="readout-b" text-anchor="middle"><textPath href="#arc-readout" startOffset="50%" id="readout-b-text">00:00:00</textPath></text>
    <text class="readout" id="readout-c" text-anchor="middle" opacity="0"><textPath href="#arc-readout" startOffset="50%" id="readout-c-text">00:00:00</textPath></text>

    <!-- hands, drawn pointing to 12 and rotated about the centre -->
    <g id="hand-hour" fill="#fff" filter="url(#shadow-10)">
      <rect x="-6" y="-93" width="12" height="121" rx="6"/>
      <circle r="16"/>
    </g>
    <g id="hand-minute" fill="#fff" filter="url(#shadow-15)">
      <rect x="-6" y="-160" width="12" height="190" rx="6"/>
      <circle r="10"/>
    </g>
    <g id="hand-second" fill="#ff4e89">
      <rect x="-1" y="-150" width="2" height="175" rx="1"/>
      <circle r="6"/>
    </g>
  </svg>

  <p class="sr-only" id="readout" aria-live="off"></p>

<script>
(() => {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const DAY = 86_400_000;

  // ── Buddhist units (摩訶僧祇律): 30 須臾 a day, 20 羅豫 a 須臾, 20 彈指 a 羅豫 ──
  const MUHURTA = DAY / 30;          // 須臾  2 880 000 ms (48 min)
  const LAYA    = MUHURTA / 20;      // 羅豫    144 000 ms (2 min 24 s)
  const ACCHATA = LAYA / 20;         // 彈指      7 200 ms

  // Hand angles in degrees, not wrapped, so in-between angles stay continuous.
  //   Buddhist:     hour 1 turn a day (30 須臾 per turn) · minute 1 turn per 須臾 · second 1 turn per 羅豫
  //   Conventional: hour 2 turns a day · minute 1 turn an hour · second 1 turn a minute
  const anglesB = t => ({ h: t / DAY * 360, m: t / MUHURTA * 360, s: t / LAYA * 360 });
  const anglesC = t => ({ h: t / DAY * 720, m: t / 3_600_000 * 360, s: t / 60_000 * 360 });

  // ── ticks: 30 for 須臾 (every 12°), 12 for hours (every 30°) ───────────
  // Tick k (0–11) moves clockwise from 12k° to 30k°. Ticks 12–29 are swept the same way
  // into 12 o'clock and fade out, so the face folds up like a fan; switching back unfolds it.
  const N_B = 30, N_C = 12;
  const R_OUT = 170, LEN = 10;              // 10px in from the 180px rim
  const THIN = 2, BOLD = 6;
  const THIN_OPACITY = 0.5;
  // Bold ticks (6px, full white): Buddhist 5, 10, 15, 20, 25, 30 (every 5th 須臾, 30 at the top);
  // conventional 3, 6, 9, 12. The rest are 2px at 50%.
  // A tick that changes role thickens/thins and brightens/dims as it travels.
  const isBoldB = k => k % 5 === 0;
  const isBoldC = k => k % 3 === 0;
  const widthB = k => (isBoldB(k) ? BOLD : THIN);
  const widthC = k => (isBoldC(k) ? BOLD : THIN);
  const opacityB = k => (isBoldB(k) ? 1 : THIN_OPACITY);
  const opacityC = k => (isBoldC(k) ? 1 : THIN_OPACITY);
  const tickGroup = document.getElementById('ticks');
  const ticks = [];
  const setWidth = (r, w) => {
    const v = w.toFixed(3);
    if (r.dataset.w === v) return;
    r.dataset.w = v;
    r.setAttribute('x', (-w / 2).toFixed(3));
    r.setAttribute('width', v);
  };
  for (let k = 0; k < N_B; k++) {
    const r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('y', -R_OUT);
    r.setAttribute('height', LEN);
    setWidth(r, widthB(k));
    r.setAttribute('opacity', opacityB(k));
    tickGroup.appendChild(r);
    ticks.push(r);
  }

  const handH = document.getElementById('hand-hour');
  const handM = document.getElementById('hand-minute');
  const handS = document.getElementById('hand-second');
  const labelB = document.getElementById('label-b');
  const labelC = document.getElementById('label-c');
  const readB = document.getElementById('readout-b');
  const readC = document.getElementById('readout-c');
  const readBText = document.getElementById('readout-b-text');
  const readCText = document.getElementById('readout-c-text');
  const srReadout = document.getElementById('readout');
  const clock = document.getElementById('clock');
  const skies = [...document.querySelectorAll('.sky')];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

  // ── second hand colour ─────────────────────────────────────────────
  // Always a fully saturated sRGB colour (one channel at 255, one at 0), i.e. the most
  // chromatic colour the screen can show for that hue, so it never turns grey or muddy.
  // Hue advances evenly in OKLCH (perceptual) hue: half the wheel per minute,
  // starting from a random hue when the page loads.
  const pureRGB = h => {                    // HSL(h, 100%, 50%) → [r, g, b] 0–1
    const k = n => (n + h / 30) % 12;
    const f = n => 0.5 - 0.5 * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0), f(8), f(4)];
  };
  const okHue = ([r, g, b]) => {            // sRGB → OKLab hue in degrees
    const lin = c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    const R = lin(r), G = lin(g), B = lin(b);
    const l = Math.cbrt(0.4122214708 * R + 0.5363325363 * G + 0.0514459929 * B);
    const m = Math.cbrt(0.2119034982 * R + 0.6806995451 * G + 0.1073969566 * B);
    const s = Math.cbrt(0.0883024619 * R + 0.2817188376 * G + 0.6299787005 * B);
    const A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
    const Bb = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
    return Math.atan2(Bb, A) * 180 / Math.PI;
  };
  // table: HSL hue → OKLCH hue (unwrapped, increasing), inverted by interpolation
  const HUE_STEPS = 1440;
  const okTable = [];
  for (let i = 0, prev = null; i <= HUE_STEPS; i++) {
    let v = okHue(pureRGB(i * 360 / HUE_STEPS));
    if (prev !== null) {
      while (v < prev - 180) v += 360;      // unwrap the ±180° seam
      v = Math.max(v, prev);                // flatten a hair-thin reversal near pure blue
    }
    okTable.push(v);
    prev = v;
  }
  function pureColourAtOkHue(theta) {
    const t = okTable[0] + ((((theta - okTable[0]) % 360) + 360) % 360);
    let lo = 0, hi = HUE_STEPS;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (okTable[mid] <= t) lo = mid; else hi = mid; }
    const f = (t - okTable[lo]) / ((okTable[hi] - okTable[lo]) || 1);
    const hslHue = (lo + f) * 360 / HUE_STEPS;
    const [r, g, b] = pureRGB(hslHue % 360);
    return `rgb(${Math.round(r * 255)} ${Math.round(g * 255)} ${Math.round(b * 255)})`;
  }
  const hueStart = Math.random() * 360;
  const hueStartTime = performance.now();
  const HUE_PER_MS = 180 / 60_000;          // half the hue wheel per minute

  // ── switching state ─────────────────────────────────────────────────
  // u runs 0 (Buddhist) ↔ 1 (conventional); e = eased u drives everything.
  let u = 0, target = 0, lastTs = 0;
  const turns = { h: 0, m: 0, s: 0 };   // whole turns added so each hand takes the short way round
  const duration = () => (reduceMotion.matches ? 400 : 1800);

  const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const clamp01 = x => Math.min(1, Math.max(0, x));

  const msOfDay = d =>
    ((d.getHours() * 60 + d.getMinutes()) * 60 + d.getSeconds()) * 1000 + d.getMilliseconds();

  function toggle() {
    if (u === target) {
      // starting from rest: pick the shortest way for each hand
      const t = msOfDay(new Date());
      const A = anglesB(t), C = anglesC(t);
      for (const key of ['h', 'm', 's']) turns[key] = Math.round((A[key] - C[key]) / 360);
    }
    target = 1 - target;
  }

  addEventListener('click', toggle);
  addEventListener('keydown', ev => {
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); toggle(); }
  });

  // ── sky by time of day ──────────────────────────────────────────────
  function skyFor(h) {
    if (h >= 19 || h < 3) return 'night';
    if (h < 5) return 'predawn';
    if (h < 12) return 'morning';
    if (h < 17) return 'afternoon';
    return 'dusk';
  }
  // The incoming sky fades in on top of the outgoing one, which stays put until it is covered,
  // so the page never dips toward the base colour mid-fade.
  let currentSky = null, skyZ = 1, skyTimer = 0;
  function setSky(name, instant) {
    if (name === currentSky) return;
    currentSky = name;
    const next = skies.find(el => el.dataset.sky === name);
    clearTimeout(skyTimer);
    if (instant) {
      for (const el of skies) {
        el.style.transition = 'none';
        el.classList.toggle('is-on', el === next);
        void el.offsetWidth;
        el.style.transition = '';
      }
      return;
    }
    next.style.zIndex = ++skyZ;
    next.classList.add('is-on');
    const settle = () => {
      clearTimeout(skyTimer);
      next.removeEventListener('transitionend', settle);
      if (currentSky !== name) return;
      for (const el of skies) {
        if (el === next) continue;
        el.style.transition = 'none';
        el.classList.remove('is-on');
        void el.offsetWidth;
        el.style.transition = '';
      }
    };
    next.addEventListener('transitionend', settle);
    skyTimer = setTimeout(settle, 9000);   // fallback if the transition never reports back
  }

  const pad = n => String(n).padStart(2, '0');
  const wrap = a => ((a % 360) + 360) % 360;
  let lastB = '', lastC = '';

  function frame(ts) {
    const dt = lastTs ? Math.min(100, ts - lastTs) : 0;
    lastTs = ts;
    if (u !== target) {
      const step = dt / duration();
      u = target > u ? Math.min(target, u + step) : Math.max(target, u - step);
    }
    const e = easeInOut(u);

    const now = new Date();
    const t = msOfDay(now);
    const A = anglesB(t), C = anglesC(t);

    // hands: blend from the Buddhist angle toward the conventional one
    const blend = key => A[key] + e * (C[key] + 360 * turns[key] - A[key]);
    handH.setAttribute('transform', `rotate(${wrap(blend('h')).toFixed(3)})`);
    handM.setAttribute('transform', `rotate(${wrap(blend('m')).toFixed(3)})`);
    handS.setAttribute('transform', `rotate(${wrap(blend('s')).toFixed(3)})`);
    handS.setAttribute('fill', pureColourAtOkHue(hueStart + (ts - hueStartTime) * HUE_PER_MS));

    // ticks: k < 12 moves from 12k° to 30k°; the extra ticks close in on 360° and shrink away
    const fade = 1 - clamp01(e / 0.75);
    for (let k = 0; k < N_B; k++) {
      const from = 12 * k;
      const to = k < N_C ? 30 * k : 360;
      const a = from + (to - from) * e;
      if (k < N_C) {
        ticks[k].setAttribute('transform', `rotate(${a.toFixed(3)})`);
        setWidth(ticks[k], widthB(k) + (widthC(k) - widthB(k)) * e);
        ticks[k].setAttribute('opacity', (opacityB(k) + (opacityC(k) - opacityB(k)) * e).toFixed(3));
      } else {
        const g = Math.max(0.0001, fade);
        // scale the tick's length about its outer end
        ticks[k].setAttribute('transform',
          `rotate(${a.toFixed(3)}) translate(0 ${-R_OUT}) scale(1 ${g.toFixed(4)}) translate(0 ${R_OUT})`);
        ticks[k].setAttribute('opacity', (opacityB(k) * fade).toFixed(3));
      }
    }

    // words: the outgoing set leaves in the first half, the incoming one arrives in the second
    const outOp = clamp01(1 - e * 2), inOp = clamp01(e * 2 - 1);
    labelB.setAttribute('opacity', outOp.toFixed(3));
    readB.setAttribute('opacity', outOp.toFixed(3));
    labelC.setAttribute('opacity', inOp.toFixed(3));
    readC.setAttribute('opacity', inOp.toFixed(3));

    // readouts: 須臾:羅豫:彈指 and HH:MM:SS
    const b = `${pad(Math.floor(t / MUHURTA))}:${pad(Math.floor(t / LAYA) % 20)}:${pad(Math.floor(t / ACCHATA) % 20)}`;
    const c = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    if (b !== lastB) { readBText.textContent = b; lastB = b; }
    if (c !== lastC) {
      readCText.textContent = c; lastC = c;
      srReadout.textContent = target === 0 ? `Buddhist time ${b}` : `Conventional time ${c}`;
    }

    setSky(skyFor(now.getHours()), false);
    requestAnimationFrame(frame);
  }

  // ── scale the clock to the screen ──────────────────────────────────
  // The face is 360px wide; the label and readout arcs reach 214px from the centre,
  // so the whole clock needs 364 × 432. It grows or shrinks to fill the screen the way
  // it fills a phone. Phones keep a 12px margin; larger screens get proportionally more
  // breathing room so the clock never presses against the edges.
  function fit() {
    const short = Math.min(innerWidth, innerHeight);
    const margin = 12 + Math.max(0, short - 400) * 0.06;
    const s = Math.min((innerWidth - 2 * margin) / 364, (innerHeight - 2 * margin) / 432);
    document.documentElement.style.setProperty('--s', Math.max(0.3, s).toFixed(4));
  }
  addEventListener('resize', fit);
  fit();

  setSky(skyFor(new Date().getHours()), true);
  requestAnimationFrame(frame);

  const fonts = Promise.all([
    document.fonts.load('400 28px "Fraunces"', 'the Buddhist Time'),
    document.fonts.load('600 28px "Fraunces"', '0123456789:'),
  ]).catch(() => {});
  Promise.race([fonts, new Promise(r => setTimeout(r, 3000))])
    .then(() => requestAnimationFrame(() => clock.classList.add('is-ready')));
})();
</script>
</body>
</html>
